name: CI

on:
  pull_request:
  # main is covered by deploy.yml, which calls this workflow before deploying.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    name: JS (lint, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm check:ci
      - name: Build (includes the web privacy gate)
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Regression index (REGRESSION.md)
        run: node scripts/regressions.mjs
      - name: Repo scripts
        run: node --test scripts/*.test.mjs

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (slow real-MPC and live-network tests stay #[ignore])
        run: cargo test --workspace --locked
      # The sdk against the three relayer binaries (dev config, plaintext matcher); the
      # real-MPC variant runs nightly. Reuses the test build's dependencies.
      - name: Build the relayer (dev-insecure)
        run: cargo build --locked -p zpredict-relayer --features dev-insecure
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @zpredict/sdk
      - name: sdk ↔ relayers
        run: pnpm --filter @zpredict/sdk test:relayers
        env:
          RELAYER_BIN: ${{ github.workspace }}/target/debug/zpredict-relayer

  e2e:
    name: Web e2e (headless Chrome, mock relayers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Judge mode → fill → chart → withdraw → deposit
        run: pnpm --filter @zpredict/web e2e
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
