[workspace]
resolver = "3"
members = [
    "apps/faucet",
    "apps/relayer",
    "packages/circuit",
    "packages/core",
    "packages/oracle",
    "packages/plugins/ironwood-pool",
    "packages/plugins/nu7-activation",
    "packages/plugins/polymarket",
    "packages/plugins/shielded-actions",
    "packages/settle",
]
# Vendored polytune with a preprocess/online split (see its Cargo.toml): its own workspace.
exclude = ["vendor/polytune"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/zpredict/zpredict"

# polytune and the Garble compiler are unusably slow unoptimized; keeps `cargo test` fast.
# zpredict-circuit too: polytune's generic `mpc` is compiled inside it.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.zpredict-circuit]
opt-level = 3

# The relayer instantiates polytune's `mpc` over its own Noise channel, so same reason.
[profile.dev.package.zpredict-relayer]
opt-level = 3

# Shipped binaries (relayer, frost-pczt): one codegen unit and thin LTO for MPC speed, no symbols.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
