# Hosted testnet relayers. One file for all three; compose.yaml sets ZPREDICT_INDEX per
# container. Noise keys are compose secrets (from Coolify env), never in this file or git.
index = 0
network = "testnet"
listen = "0.0.0.0:8080"
# Static IPs on the internal `peers` network in compose.yaml (peers must be socket addresses).
peers = ["10.0.250.10:9000", "10.0.250.11:9000", "10.0.250.12:9000"]
key_file = "/run/secrets/relayer_key"
peer_keys = ["/run/secrets/r0_pub", "/run/secrets/r1_pub", "/run/secrets/r2_pub"]
web_origin = "https://app.zpredict.site"
# Markets resolve from mainnet; the escrow and deposits are on testnet.
oracle_lightwalletd = "https://zec.rocks:443"
escrow_lightwalletd = "https://testnet.zec.rocks:443"
# 8 slots, 32 rows (default), all open markets in one run: ~6.2 s MPC on an M4 Pro, ~37 s
# on the VPS (2026-10-22). 92% of it is preprocessing, which the relayers now do ahead of
# the batch (#94), so a window with orders only runs the online part (~0.5 s M4, ~3 s
# VPS) and an idle window is just a hello: the window no longer has to cover a batch.
# Fill ≈ window/2 + online when a preprocessed run is ready (~7 s on the VPS), up to one
# preprocessing (~33 s) more when an order lands right after another batch.
batch_size = 8
# 48 accounts for judging (#99): every judge browser takes one row and rows are never
# reclaimed (#64). On an M4 Pro: preprocessing 8.0 s, online 0.75 s (×5.7 on the VPS:
# ~46 s and ~4 s), so a fill takes ~8 s with a run ready and up to ~50 s back to back.
# Relayer 0 logs "table: N of 48 rows used"; when it is full, Judge mode says so.
table_rows = 48
window_secs = 5
# Batches, not seconds: ~30 s for a browser's three POSTs to all arrive.
expire_batches = 6
judge = true
judge_credit = 5000 # 25 units in half-ticks
data_dir = "/data"
insecure_matcher = false
# Key ceremony output (#78, deploy/production/ceremony.sh) in each relayer's own volume.
# Served at GET /memo-key; the sealed secrets are opened with ZPREDICT_STORE_KEY (env).
memo_key_file = "/data/escrow/memo.pub"

# Rolling markets (apps/relayer/src/markets/rolling.rs): every hour of nominal block time, a
# new "Will mainnet block H contain ≥ N shielded actions?" with H one hour ahead (48 blocks
# at 75 s; 144 at 25 s from NU7) and N the median of the 24 blocks before, so YES/NO are
# about even. Ids are 1,000,000 + window number, the same on all three relayers.
# Cap: one MPC run clears 4 markets (DEFAULT_MARKETS) = the 3 headline markets below + 1
# rolling market, which interval = horizon guarantees. Resolved ones stay 24 h as history.
[rolling]
plugin = "shielded-actions"
interval_secs = 3600
horizon_secs = 3600
close_secs = 300
sample_blocks = 24
keep_resolved = 24
fast_from = 3543405

# The three headline markets. One MPC run clears up to 4 markets; more would need a second
# run per window and slow judges' fills (see deploy/README.md).
[[markets]]
id = 1
question = "Will NU7 activate on mainnet at block 3,543,405?"
plugin = "nu7-activation"
params = { activationHeight = 3543405 }
closeHeight = 3543000
resolveHeight = 3543405
status = "open"

[[markets]]
id = 2
question = "Will the Ironwood pool hold ≥ 900,000 notes at block 3,560,000?"
plugin = "ironwood-pool"
params = { minNotes = 900000 }
closeHeight = 3559000
resolveHeight = 3560000
status = "open"

[[markets]]
id = 3
question = "Will block 3,550,000 contain at least 5 shielded actions?"
plugin = "shielded-actions"
params = { minActions = 5 }
closeHeight = 3549000
resolveHeight = 3550000
status = "open"

# Real testnet deposits and payouts. The FROST key share also signs outcomes, so
# /group-key answers and outcomes carry outcomeSig. Relayer 0 is the prover: zcash-devtool
# is in the image, its escrow wallet is opened into tmpfs by the escrow-wallet sidecar.
# r1 and r2 ignore the three prover keys.
[settlement]
network = "test"
ufvk = "/data/escrow/ufvk.sealed"
memo_key = "/data/escrow/memo.sealed"
key_share = "/data/escrow/share.sealed"
start_height = 4530716 # testnet tip at the key ceremony (2026-10-23)
devtool = "/usr/local/bin/zcash-devtool"
wallet_dir = "/wallet"
devtool_server = "zecrocks"
