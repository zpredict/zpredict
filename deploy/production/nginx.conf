# Host nginx on the demo VPS (/etc/nginx/sites-available/zpredict.site). This box fronts
# every Coolify app with nginx + certbot instead of Traefik; Coolify publishes each
# container on a loopback port only. TLS: one Let's Encrypt cert for all five names,
# issued with certbot webroot (/home/cuyvps/acme) and renewed by the user's cron.
#
# Privacy: no access log, error log discarded (nginx puts client IPs in both), and the
# client-IP headers Cloudflare adds are stripped before the containers, so nothing behind
# nginx is ever handed the caller's address.

server {
    listen 80;
    listen [::]:80;
    server_name zpredict.site app.zpredict.site r0.zpredict.site r1.zpredict.site r2.zpredict.site;
    access_log off;
    error_log /dev/null crit;
    location /.well-known/acme-challenge/ { root /home/cuyvps/acme; }
    location / { return 301 https://$host$request_uri; }
}

# Host -> loopback port Coolify publishes: apps landing, web; compose services r0-r2.
map $host $zpredict_upstream {
    zpredict.site     127.0.0.1:3170;
    app.zpredict.site 127.0.0.1:3171;
    r0.zpredict.site  127.0.0.1:3172;
    r1.zpredict.site  127.0.0.1:3173;
    r2.zpredict.site  127.0.0.1:3174;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zpredict.site app.zpredict.site r0.zpredict.site r1.zpredict.site r2.zpredict.site;
    ssl_certificate     /home/cuyvps/le/config/live/zpredict.site/fullchain.pem;
    ssl_certificate_key /home/cuyvps/le/config/live/zpredict.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    # Relayer bodies are capped at 1 KiB; the static sites take none.
    client_max_body_size 4k;

    location /.well-known/acme-challenge/ { root /home/cuyvps/acme; }
    location / {
        proxy_pass http://$zpredict_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # nginx passes request headers through unless told otherwise; "" drops them.
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-Connecting-IPv6 "";
        proxy_set_header True-Client-IP "";
        proxy_set_header CF-IPCountry "";
        proxy_set_header CF-Ray "";
        proxy_set_header CF-Visitor "";
        proxy_set_header CDN-Loop "";
    }
}
