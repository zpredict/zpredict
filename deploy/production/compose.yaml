# The three hosted testnet relayers as one Coolify "Docker Compose" resource. Each API is
# published on loopback only; host nginx (nginx.conf) serves it as https://rN.zpredict.site.
# MPC peer traffic (Noise KK, encrypted) stays on the internal `peers` network.
#
# Demo only: all three run on one VM, so one operator could read every share. The
# security model needs three independent operators; see deploy/README.md.
#
# Secrets: set in Coolify (Environment Variables), never in git. R{0,1,2}_KEY are the
# Noise private keys, R{0,1,2}_PUB the public keys (hex). Compose mounts them as files
# under /run/secrets, so the private key is never in a container's environment.
# R{0,1,2}_STORE_KEY (64 hex, different per relayer) opens that relayer's sealed escrow
# secrets in /data/escrow (key ceremony, deploy/production/ceremony.sh). The settle store
# reads it from the environment only.

# The image is built once (by r0) and shared, so three cargo builds never run at once.
x-relayer: &relayer
  image: zpredict-relayer:local
  pull_policy: never
  restart: unless-stopped
  # Peak RSS on Linux (VmHWM, 8 slots, 4 markets, a preprocessed run held, #94/#99): at 32
  # rows r0 728 MiB, r1 423, r2 473; at 48 rows (this deployment) r0 1,061-1,092, r1
  # 537-559, r2 578-586. Relayer 0, the evaluator, holds the garbled tables, so it gets a
  # larger cap. The VPS measured 32 rows at r0 694, r1 421, r2 389 (docker stats).
  mem_limit: 768m
  memswap_limit: 768m
  cpus: 2
  # No read_only: compose copies env-sourced secrets into the container filesystem.

services:
  r0:
    <<: *relayer
    build:
      context: ../..
      dockerfile: deploy/production/relayer.Dockerfile
    pull_policy: build
    # 48-row peak ~1.1 GiB (above) + headroom for zcash-devtool proving payouts next to it.
    mem_limit: 1536m
    memswap_limit: 1536m
    depends_on:
      escrow-wallet: { condition: service_healthy }
    environment:
      ZPREDICT_INDEX: 0
      ZPREDICT_STORE_KEY: ${R0_STORE_KEY:?}
    secrets:
      - { source: r0_key, target: relayer_key }
      - r0_pub
      - r1_pub
      - r2_pub
    volumes: [r0-data:/data, escrow-wallet:/wallet]
    ports: ["127.0.0.1:3172:8080"]
    networks:
      default:
      peers: { ipv4_address: 10.0.250.10 }
  # Relayer 0's escrow wallet (holds the viewing key) lives only in this tmpfs volume:
  # the sidecar opens the sealed copy into it and stays up so it survives r0 restarts.
  # Same image as the relayers (built by r0 in this deploy), so nothing it needs can have
  # been pruned since an earlier one (#124).
  escrow-wallet:
    image: zpredict-relayer:local
    pull_policy: never
    restart: unless-stopped
    entrypoint: ["escrow-wallet.sh"]
    environment:
      ZPREDICT_STORE_KEY: ${R0_STORE_KEY:?}
    volumes: [r0-data:/data:ro, escrow-wallet:/wallet]
    network_mode: none
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "test", "-e", "/tmp/ready"]
      interval: 5s
      retries: 30
  r1:
    <<: *relayer
    depends_on: [r0]
    environment:
      ZPREDICT_INDEX: 1
      ZPREDICT_STORE_KEY: ${R1_STORE_KEY:?}
    secrets:
      - { source: r1_key, target: relayer_key }
      - r0_pub
      - r1_pub
      - r2_pub
    volumes: [r1-data:/data]
    ports: ["127.0.0.1:3173:8080"]
    networks:
      default:
      peers: { ipv4_address: 10.0.250.11 }
  r2:
    <<: *relayer
    depends_on: [r0]
    environment:
      ZPREDICT_INDEX: 2
      ZPREDICT_STORE_KEY: ${R2_STORE_KEY:?}
    secrets:
      - { source: r2_key, target: relayer_key }
      - r0_pub
      - r1_pub
      - r2_pub
    volumes: [r2-data:/data]
    ports: ["127.0.0.1:3174:8080"]
    networks:
      default:
      peers: { ipv4_address: 10.0.250.12 }

secrets:
  r0_key: { environment: R0_KEY }
  r1_key: { environment: R1_KEY }
  r2_key: { environment: R2_KEY }
  r0_pub: { environment: R0_PUB }
  r1_pub: { environment: R1_PUB }
  r2_pub: { environment: R2_PUB }

networks:
  peers:
    internal: true
    ipam:
      config:
        - subnet: 10.0.250.0/24

volumes:
  # tmpfs: the unsealed escrow wallet never reaches the disk.
  escrow-wallet:
    driver_opts: { type: tmpfs, device: tmpfs, o: "size=256m,uid=65532,gid=65532,mode=0700" }
  r0-data:
  r1-data:
  r2-data:
