# Local relayer 2 of 3: same as r0.toml except index, listen, key_file and
# data_dir. Paths are relative to this file. Any top-level scalar can be overridden with
# ZPREDICT_<KEY>, e.g. ZPREDICT_WEB_ORIGIN=https://app.zpredict.site.
index = 2
network = "regtest"
listen = "127.0.0.1:4103"
peers = ["127.0.0.1:4201", "127.0.0.1:4202", "127.0.0.1:4203"]
# Generated by scripts/dev.sh; keys/ is gitignored. Never commit keys.
key_file = "keys/r2.key"
peer_keys = ["keys/r0.pub", "keys/r1.pub", "keys/r2.pub"]
web_origin = "http://localhost:3000"
# Markets are about mainnet; collateral lives on testnet/regtest. Two endpoints:
# the oracle one drives /health height and market resolution, the escrow one is
# for deposit scanning and payouts. Set oracle_lightwalletd = "" to stay offline.
oracle_lightwalletd = "https://zec.rocks:443"
escrow_lightwalletd = "https://testnet.zec.rocks:443"
# 8 slots, 32 rows (default), all open markets in one run: ~6.2 s MPC on an M4 Pro, 92%
# of it preprocessed ahead of the batch (#94), so a fill shows ~window/2 + 0.5 s after
# the order when a preprocessed run is ready.
batch_size = 8
window_secs = 4
expire_batches = 3
judge = true
judge_credit = 5000 # 25 units in half-ticks
data_dir = "data/r2"
insecure_matcher = false

# Hourly rolling markets, same as production (deploy/production/relayer.toml).
[rolling]
plugin = "shielded-actions"
interval_secs = 3600
horizon_secs = 3600
close_secs = 300
sample_blocks = 24
keep_resolved = 24
fast_from = 3543405

# Same markets as deploy/production/relayer.toml.
[[markets]]
id = 1
question = "Will NU7 activate on mainnet at block 3,543,405?"
plugin = "nu7-activation"
params = { activationHeight = 3543405 }
closeHeight = 3543000
resolveHeight = 3543405
status = "open"
category = "Zcash network"
rules = "Resolves YES if the coinbase transaction of mainnet block 3,543,405 carries the NU7 consensus branch ID, read by each relayer from its own node 10 blocks later. Trading closes at block 3,543,000."

[[markets]]
id = 2
question = "Will the Ironwood pool hold ≥ 900,000 notes at block 3,560,000?"
plugin = "ironwood-pool"
params = { minNotes = 900000 }
closeHeight = 3559000
resolveHeight = 3560000
status = "open"
category = "Zcash network"
rules = "Resolves YES if the Ironwood note commitment tree holds at least 900,000 notes at the end of mainnet block 3,560,000, read by each relayer from its own node 10 blocks later. Trading closes at block 3,559,000."

# Mirrored Polymarket markets (packages/plugins/polymarket, #114): same question, our own
# private book. The oracle is Polymarket (UMA): YES iff Polymarket settles "Yes" to 1. Each
# relayer reads gamma-api.polymarket.com itself; the outcome is signed only if all three
# read the same. Binary Yes/No only (checked at startup); no death or violence markets.
# Trading closes at block 3,540,470 ≈ 2026-11-03 12:00 UTC (75 s blocks from 3,527,437 at
# 2026-10-23 04:25 UTC), before US polls open; resolveHeight = closeHeight, the resolver
# then waits for Polymarket. 11 and 12 are the two rows of one Polymarket event.
[[markets]]
id = 11
question = "Will the Democratic Party control the House after the 2026 Midterm elections?"
plugin = "polymarket"
params = { conditionId = "0xd5d9fc47718bd553592d126b1fa5e87183d27f3936975b0c04cc0f2dec1f1bb4", slug = "will-the-democratic-party-control-the-house-after-the-2026-midterm-elections" }
closeHeight = 3540470
resolveHeight = 3540470
status = "open"
category = "Politics"
event = { id = "house-2026", title = "Which party will win the House in 2026?" }
rules = "Mirrors the Polymarket market of the same question. Resolves YES if Polymarket settles it Yes (UMA optimistic oracle); No, or a 50-50 settlement, resolves NO. Trading here closes at block 3,540,470 (about Nov 3, 12:00 UTC); the outcome follows whenever Polymarket settles."

[[markets]]
id = 12
question = "Will the Republican Party control the House after the 2026 Midterm elections?"
plugin = "polymarket"
params = { conditionId = "0x4e4f77e7dbf4cab666e9a1943674d7ae66348e862df03ea6f44b11eb95731928", slug = "will-the-republican-party-control-the-house-after-the-2026-midterm-elections" }
closeHeight = 3540470
resolveHeight = 3540470
status = "open"
category = "Politics"
event = { id = "house-2026", title = "Which party will win the House in 2026?" }
rules = "Mirrors the Polymarket market of the same question. Resolves YES if Polymarket settles it Yes (UMA optimistic oracle); No, or a 50-50 settlement, resolves NO. Trading here closes at block 3,540,470 (about Nov 3, 12:00 UTC); the outcome follows whenever Polymarket settles."

