[package]
name = "zpredict-plugin-nu7-activation"
description = "zPredict market: YES iff NU7 is active at the stated activation height"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
zpredict-oracle = { path = "../../oracle" }

[dev-dependencies]
serde_json = "1"
zpredict-oracle = { path = "../../oracle", features = ["fixture"] }
