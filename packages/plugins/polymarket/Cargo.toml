[package]
name = "zpredict-plugin-polymarket"
description = "zPredict market: mirrors a binary Polymarket market, YES iff it resolved Yes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zpredict-oracle = { path = "../../oracle" }

[dev-dependencies]
zpredict-oracle = { path = "../../oracle", features = ["fixture"] }
