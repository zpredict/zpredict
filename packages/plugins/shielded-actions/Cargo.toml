[package]
name = "zpredict-plugin-shielded-actions"
description = "zPredict market: YES iff a block holds at least N shielded actions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
zpredict-oracle = { path = "../../oracle" }

[dev-dependencies]
serde_json = "1"
zpredict-oracle = { path = "../../oracle", features = ["fixture"] }
