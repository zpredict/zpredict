[package]
name = "zpredict-settle"
description = "Escrow scanning, batched payouts and FROST 2-of-3 signing for zPredict's Ironwood escrow"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Same librustzcash generation as zcash-devtool eb38d7a (NU7 branch ID 0x77190AD9).
[dependencies]
base64 = "0.22"
blake2b_simd = "1"
chacha20poly1305 = { version = "0.11", features = ["alloc"] }
ff = "0.14"
hex = "0.4"
orchard = { version = "=0.16.0", features = ["unstable-frost"] }
pczt = { version = "=0.10.0", features = ["orchard", "signer"] }
rand = { version = "0.10", features = ["std", "sys_rng"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# frost-core 2.2 / frost-rerandomized 2.1 RedPallas at the exact rev frost-zcash-demo
# 53df99c (our DKG) uses, so its key packages deserialize unchanged.
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", features = ["frost"] }
zcash_address = "0.14"
zcash_client_backend = { version = "=0.25.0", features = ["pczt"] }
zcash_client_sqlite = { version = "=0.23.0", features = ["serde", "transparent-inputs"] }
zcash_keys = { version = "=0.17.0", features = ["orchard", "unstable-frost"] }
zcash_primitives = "=0.31.0"
zcash_protocol = { version = "=0.11.0", features = ["local-consensus"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
zip321 = "0.10"
zpredict-oracle = { path = "../oracle" }

[dev-dependencies]
incrementalmerkletree = "0.9"
serde_json = "1"
